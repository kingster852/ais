<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIS Airport Map</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="airport.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <header>
        <div class="header-content">
            <h1>✈️ AIS Airport Map</h1>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="#" id="navName" class="active">Map</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="airport-container">
            <div class="airport-header">
                <h2 id="airportTitle">Loading...</h2>
                <p id="airportSubtitle"></p>
            </div>
            <div class="airport-content">
                <div class="map-box">
                    <div id="map"></div>
                </div>
                <div class="info-box">
                    <h3>Info</h3>
                    <div class="data-row"><span>ICAO:</span> <span id="infoIcao">-</span></div>
                    <div class="data-row"><span>IATA:</span> <span id="infoIata">-</span></div>
                    <div class="data-row"><span>Elevation:</span> <span id="infoElev">-</span></div>
                    <div class="data-row"><span>Runways:</span> <span id="infoRunways">-</span></div>
                    <p id="osmStatus">Loading airport data...</p>
                    <h3>Switch Airport</h3>
                    <select id="airportSelect" onchange="changeAirport(this.value)">
                        <option value="HKG">Hong Kong</option>
                        <option value="JFK">New York JFK</option>
                        <option value="LHR">London Heathrow</option>
                        <option value="DXB">Dubai</option>
                        <option value="LAX">Los Angeles</option>
                        <option value="SIN">Singapore</option>
                        <option value="CDG">Paris CDG</option>
                        <option value="NRT">Tokyo Narita</option>
                        <option value="SYD">Sydney</option>
                        <option value="FRA">Frankfurt</option>
                        <option value="AMS">Amsterdam</option>
                    </select>
                    <a href="index.html" class="back-link">← Back to Dashboard</a>
                </div>
            </div>
        </div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="airport.js"></script>
</body>
</html>
